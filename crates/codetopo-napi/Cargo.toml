[package]
name = "codetopo-napi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Node.js native surface for codetopo (napi-rs): the twenty CODE_SCHEMA operations over the Rust core, in-process, as Promises and plain JSON"
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["development-tools"]

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "3"
napi-derive = "3"
codetopo-core = { version = "0.9.0", path = "../codetopo-core" }
codetopo-cli = { version = "0.9.0", path = "../codetopo-cli" }
codetopo-store = { version = "0.9.0", path = "../codetopo-store" }
serde_json = { version = "1", features = ["float_roundtrip"] }

[build-dependencies]
napi-build = "2"
