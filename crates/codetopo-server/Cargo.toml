[package]
name = "codetopo-server"
version = "0.6.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "codetopo's HTTP API server: the same code-graph queries over REST, with bearer-key auth and per-key metering"
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "development-tools", "web-programming::http-server"]

[[bin]]
name = "codetopo-server"
path = "src/main.rs"

[dependencies]
codetopo-cli = { version = "0.6.0", path = "../codetopo-cli" }
codetopo-core = { version = "0.6.0", path = "../codetopo-core" }
codetopo-store = { version = "0.6.0", path = "../codetopo-store" }
axum = "0.7"
flate2 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
subtle = "2"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.4", features = ["util"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
# Ingest reads archives entry by entry and never bulk-extracts; only the
# deflate reader (over flate2, already linked for tar.gz) is enabled.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
flate2 = "1"
tar = "0.4"
tempfile = "3"
tower = { version = "0.4", features = ["util"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
