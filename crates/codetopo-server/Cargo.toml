[package]
name = "codetopo-server"
version = "0.3.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "codetopo's HTTP API server: the same code-graph queries over REST, with bearer-key auth and per-key metering"
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "development-tools", "web-programming::http-server"]

[[bin]]
name = "codetopo-server"
path = "src/main.rs"

[dependencies]
codetopo-cli = { version = "0.3.0", path = "../codetopo-cli" }
codetopo-core = { version = "0.3.0", path = "../codetopo-core" }
codetopo-store = { version = "0.3.0", path = "../codetopo-store" }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "0.4", features = ["util"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.4", features = ["util"] }
