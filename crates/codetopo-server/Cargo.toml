[package]
name = "codetopo-server"
version = "0.2.1"
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "codetopo-server"
path = "src/main.rs"

[dependencies]
codetopo-cli = { path = "../codetopo-cli" }
codetopo-core = { path = "../codetopo-core" }
codetopo-store = { path = "../codetopo-store" }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "0.4", features = ["util"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.4", features = ["util"] }
