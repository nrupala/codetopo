[package]
name = "codetopo-extract"
version = "0.9.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Tree-sitter extraction for codetopo: symbols, calls, imports, reads/writes, and heritage from Rust, TypeScript/JavaScript, Python, Kotlin, C, Java, Go, Shell, C++, Swift, Ruby, R, Julia, C#, PHP, and Scala sources"
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["development-tools", "parsing"]

[dependencies]
codetopo-core = { version = "0.9.1", path = "../codetopo-core" }
serde_json = { version = "1", features = ["float_roundtrip"] }
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate", "_deflate-any"] }
tree-sitter-kotlin-ng = "1.1"
tree-sitter-c = "0.24"
tree-sitter-java = "0.23"
tree-sitter-go = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-cpp = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-ruby = "0.23"
tree-sitter-r = "1"
tree-sitter-julia = "0.23"
tree-sitter-c-sharp = "0.24"
tree-sitter-php = "0.25"
tree-sitter-scala = "0.26"

[dev-dependencies]
codetopo-store = { version = "0.9.1", path = "../codetopo-store" }
