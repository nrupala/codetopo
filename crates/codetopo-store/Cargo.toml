[package]
name = "codetopo-store"
version = "0.9.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "SQLite store for codetopo: graph persistence, hash-chained audit log, and HMAC proof certificates with verified restore"
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["development-tools", "database-implementations"]

[dependencies]
codetopo-core = { version = "0.9.0", path = "../codetopo-core" }
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
thiserror = "2"
serde_json = { version = "1", features = ["float_roundtrip"] }
