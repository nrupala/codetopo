[package]
name = "codetopo-core"
version = "0.8.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Typed graph core for codetopo: schema types, validated builder, deterministic queries, snapshots, and layout/render"
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: serde_json's default float parser is best-effort
# and can land 1 ULP off when a float crosses a JSON text boundary
# (found by the RA1 HTTP parity test, 2026-11-02). The analytics
# engine's determinism doctrine covers its JSON surface too, so
# float parsing is exact round-trip in every crate that carries
# codetopo measurements.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
# Analytics engine (SPEC — Rust analytics, RA0): the graph-theory stack.
# petgraph supplies the graph primitives; rustworkx-core the Brandes /
# spectral centralities; leiden-rs (pinned, wrapped behind the
# crate::projection::CommunityDetector trait) the Leiden communities.
# Licences: petgraph MIT OR Apache-2.0; rustworkx-core Apache-2.0;
# leiden-rs MIT OR Apache-2.0 (verified from the crate manifest in RA0).
petgraph = "0.8.3"
rustworkx-core = "0.18.1"
leiden-rs = { version = "=0.8.1", default-features = false }

[dev-dependencies]
