[package]
name = "codetopo-bridge"
version = "0.5.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "codetopo's Stripe billing bridge: turns subscription events into hosted API keys in the server's runtime key store, and delivers each key once through a claim page"
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "development-tools", "web-programming::http-server"]

[[bin]]
name = "codetopo-bridge"
path = "src/main.rs"

[dependencies]
codetopo-server = { version = "0.5.0", path = "../codetopo-server" }
aes-gcm = "0.10"
axum = "0.7"
hmac = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.4", features = ["util"] }
