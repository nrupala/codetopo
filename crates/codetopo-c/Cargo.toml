[package]
name = "codetopo-c"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "C ABI foundation for codetopo: a cdylib + hand-written C header exposing the CODE_SCHEMA JSON surface (index, open, and the query operations) to C, C++, R, Julia, and any FFI caller"
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["development-tools", "ffi"]

[lib]
name = "codetopo_c"
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/lib.rs"

[dependencies]
codetopo-core = { version = "0.9.1", path = "../codetopo-core" }
codetopo-cli = { version = "0.9.1", path = "../codetopo-cli" }
codetopo-store = { version = "0.9.1", path = "../codetopo-store" }
serde_json = { version = "1", features = ["float_roundtrip"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
