[package]
name = "codetopo-mcp"
version = "0.2.1"
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "codetopo-mcp"
path = "src/main.rs"

[lib]
name = "codetopo_mcp"
path = "src/lib.rs"

[dependencies]
codetopo-cli = { path = "../codetopo-cli" }
codetopo-core = { path = "../codetopo-core" }
codetopo-store = { path = "../codetopo-store" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
