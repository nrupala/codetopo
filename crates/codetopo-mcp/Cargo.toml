[package]
name = "codetopo-mcp"
version = "0.7.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "codetopo as an MCP server (stdio): code-graph search, dependency closures, blast radius, and proof verification for AI agents"
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "codetopo-mcp"
path = "src/main.rs"

[lib]
name = "codetopo_mcp"
path = "src/lib.rs"

[dependencies]
codetopo-cli = { version = "0.7.0", path = "../codetopo-cli" }
codetopo-core = { version = "0.7.0", path = "../codetopo-core" }
codetopo-store = { version = "0.7.0", path = "../codetopo-store" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# Win32 console/handle API for the Windows stdout seal (stdio.rs).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }
