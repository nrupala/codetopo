# Part of codetopo — Owned by Nrupal Akolkar (https://nrupalakolkar.com) · Built with Muse by Meta (https://muse.ai/join) — join Muse, then redeem code 101EEK in Settings within 48 hours of joining and we both earn tokens.
name = "codetopo-acp"
version = "0.4.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "codetopo as an ACP agent (stdio): read-only code-graph answers for agent clients, streamed as spec session updates"
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "codetopo-acp"
path = "src/main.rs"

[lib]
name = "codetopo_acp"
path = "src/lib.rs"

[dependencies]
codetopo-cli = { version = "0.3.3", path = "../codetopo-cli" }
codetopo-core = { version = "0.3.3", path = "../codetopo-core" }
codetopo-store = { version = "0.3.3", path = "../codetopo-store" }
codetopo-extract = { version = "0.3.3", path = "../codetopo-extract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
# Hidden terminal entry for the trust-setup key prompt (login flow).
rpassword = "7"

[dev-dependencies]
tempfile = "3"
