[package]
name = "codetopo-cli"
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "codetopo"
path = "src/main.rs"

[dependencies]
codetopo-core = { path = "../codetopo-core" }
codetopo-extract = { path = "../codetopo-extract" }
codetopo-store = { path = "../codetopo-store" }
clap = { version = "4", features = ["derive"] }
rayon = "1"
walkdir = "2"
serde_json = "1"
thiserror = "2"
