[package]
name = "codetopo-cli"
version = "0.7.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The codetopo command line: index a repository into a queryable code graph, then search, trace, prove, and render it — deterministic and read-only"
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "codetopo"
path = "src/main.rs"

[dependencies]
codetopo-core = { version = "0.7.0", path = "../codetopo-core" }
codetopo-extract = { version = "0.7.0", path = "../codetopo-extract" }
codetopo-store = { version = "0.7.0", path = "../codetopo-store" }
clap = { version = "4", features = ["derive"] }
rayon = "1"
walkdir = "2"
serde_json = "1"
thiserror = "2"
