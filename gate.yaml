test_command: "cargo test --workspace"
# Deliberately NOT declared, with reasons (an omitted field leaves the
# runner's check NOT RUN, which is the honest state):
# - rate_limit: the product's bound is a per-key monthly query quota
#   (hosted 10,000/month, guardrails 50,000/month) enforced from the
#   metering log. The runner's probe shape (limit+3 anonymous POSTs of
#   a text body) cannot express a per-key bound; the bound itself was
#   proven live at the gate (429 query_quota_exceeded at quota, a
#   second key unaffected) - certification pack, evidence/probe-output2.txt.
# - ssrf: the product's only URL-accepting surface is ingest's git
#   clone, which is not the runner's screen shape (no urls-array
#   endpoint). Its resistance is code-evidenced (https-only, embedded
#   credentials refused) and traversal-probed at the gate.
# - leakage / surfaces: the product declares no judgment surfaces -
#   its outputs are deterministic measurements, and 0.9.1's ask path
#   carries no model. There is no surface adapter to name honestly.
# - corpus: not a judgment product (certification adjudication:
#   judgment differential NOT APPLICABLE, with reason).
