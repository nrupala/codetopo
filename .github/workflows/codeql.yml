#
# CodeQL (https://codeql.github.com): vulnerability-focused static
# analysis for the Rust workspace, complementing the clippy quality
# gate in ci.yml. Runs on every push to main, every pull request,
# and weekly; findings land in the code-scanning dashboard.
#
# Rust extraction uses build-mode "none": CodeQL's Rust extractor
# does not support traced (manual/autobuild) builds — database init
# fails fatally if a build mode is requested. Extraction resolves
# the workspace through cargo metadata instead, so no build step
# runs in this job.
name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'

permissions: read-all

jobs:
  analyze:
    name: Analyze (rust)
    runs-on: ubuntu-latest
    permissions:
      # Needed for Code scanning upload
      security-events: write
      # Needed to fetch CodeQL bundles / internal workflow status
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:rust"
