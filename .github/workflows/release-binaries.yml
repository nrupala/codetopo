#
# Build the codetopo-acp and codetopo-mcp release binaries for
# every platform the registries distribute to, and attach them
# (with SHA-256 sidecars) to an existing GitHub release. Runs on a
# version-tag push, or manually against an existing tag. The
# release itself (notes, tagging) stays a deliberate, separate
# step — this workflow only builds and uploads artifacts. A
# preflight job checks the release exists before any build starts:
# v0.6.0's first two runs burned five full platform builds apiece
# and then failed at upload with "release not found" because the
# release object had not been created yet.
name: release-binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach binaries to"
        required: true

permissions:
  contents: write

jobs:
  preflight:
    name: Release exists
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: The release must already exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "${{ steps.tag.outputs.value }}" > /dev/null 2>&1; then
            echo "::error::No GitHub release exists for ${{ steps.tag.outputs.value }}. Create the release first (a deliberate, separate step), then re-run this workflow."
            exit 1
          fi

  build:
    name: ${{ matrix.platform }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-14
            platform: darwin-aarch64
            target: aarch64-apple-darwin
          - os: macos-14
            platform: darwin-x86_64
            target: x86_64-apple-darwin
          - os: windows-latest
            platform: windows-x86_64
    steps:
      - name: Resolve the tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.value }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build the release binaries
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release -p codetopo-acp -p codetopo-mcp --target "${{ matrix.target }}"
            echo "BIN_DIR=target/${{ matrix.target }}/release" >> "$GITHUB_ENV"
          else
            cargo build --release -p codetopo-acp -p codetopo-mcp
            echo "BIN_DIR=target/release" >> "$GITHUB_ENV"
          fi

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          for bin in codetopo-acp codetopo-mcp; do
            cp "$BIN_DIR/$bin" dist/
            tar -czf "$bin-${{ matrix.platform }}.tar.gz" -C dist "$bin"
            shasum -a 256 "$bin-${{ matrix.platform }}.tar.gz" > "$bin-${{ matrix.platform }}.tar.gz.sha256"
            rm "dist/$bin"
          done

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($bin in @("codetopo-acp", "codetopo-mcp")) {
            Copy-Item "$env:BIN_DIR/$bin.exe" dist/
            Compress-Archive -Path "dist/$bin.exe" -DestinationPath "$bin-${{ matrix.platform }}.zip"
            (Get-FileHash "$bin-${{ matrix.platform }}.zip" -Algorithm SHA256).Hash.ToLower() + "  $bin-${{ matrix.platform }}.zip" | Out-File -Encoding ascii "$bin-${{ matrix.platform }}.zip.sha256"
            Remove-Item "dist/$bin.exe"
          }

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.value }}" codetopo-*-${{ matrix.platform }}.* --clobber
