name: release-binaries

# Binaries are attached to an EXISTING GitHub release for a tag: push a
# version tag (whose release was created first, as a deliberate separate
# step), or run manually naming the tag.
#
# Declare -> certify (declare-certify inbuilding, step 4 — PILOT on this
# branch): the release is DECLARED by the gate job before anything is
# built, the declaration record travels between jobs as a workflow
# artifact, the certification job closes it against the combined build
# evidence from every matrix leg, and the publish job guards on the
# closed record — while the declaration is OPEN, nothing is attached.
# Actions: nrupala/platform-ci-scaffolding/declare-certify (pinned by
# commit). One adaptation from the dogear pilot: publish is not limited
# to tag pushes, because this workflow's manual mode exists to attach
# binaries to an existing release by tag — publish runs only when the
# run is anchored to a tag (a pushed tag, or the tag named on dispatch).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach binaries to"
        required: true

# Least privilege: the workflow token reads by default; the one job that
# attaches artifacts to a release declares its write scope itself.
permissions:
  contents: read

jobs:
  declare:
    name: Declare the release (gate)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      declaration-id: ${{ steps.declare.outputs.declaration-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: The release must already exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "${{ steps.tag.outputs.value }}" > /dev/null 2>&1; then
            echo "::error::No GitHub release exists for ${{ steps.tag.outputs.value }}. Create the release first (a deliberate, separate step), then re-run this workflow."
            exit 1
          fi

      # The gate job's verdict. Pilot scope: the checks this job can
      # honestly run from its own context (release identity — the tag,
      # the existing release it names, the commit and the run recording
      # them), plus the downstream gates the build and certify jobs
      # enforce before publish (the five-platform release build,
      # per-artifact SHA-256 sidecars, the combined release-evidence
      # hash verification at certification, build-provenance
      # attestation at publish). Wiring the full release-gate verdict
      # into this file is the release-gate lane's follow-on.
      - name: Gate checks + write the gate verdict
        id: gate
        shell: bash
        run: |
          {
            echo "gate verdict: DECLARED (pilot wiring)"
            echo "target: codetopo"
            echo "version: ${{ steps.tag.outputs.value }}"
            echo "base: ${GITHUB_SHA}"
            echo "ref: ${GITHUB_REF}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "identity checks: tag resolved from the push ref or the dispatch input, and the release it names verified to exist; commit recorded from the Actions context of this run"
            echo "downstream gates (build + certify jobs, before publish): five-platform cargo release build, per-artifact SHA-256 sidecars, combined release-evidence hash verification at certify, build-provenance attestation at publish"
          } > gate-verdict.md
          cat gate-verdict.md

      - name: Declare the release
        id: declare
        uses: nrupala/platform-ci-scaffolding/declare-certify/declare@41666ef6f938c01e8422d7d7b595e6438724193d
        with:
          target: codetopo
          version: ${{ steps.tag.outputs.value }}
          base: ${{ github.sha }}
          gate-verdict: gate-verdict.md

  build:
    name: ${{ matrix.platform }}
    needs: declare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-14
            platform: darwin-aarch64
            target: aarch64-apple-darwin
          - os: macos-14
            platform: darwin-x86_64
            target: x86_64-apple-darwin
          - os: windows-latest
            platform: windows-x86_64
    steps:
      - name: Resolve the tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.value }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build the release binaries
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release -p codetopo-acp -p codetopo-mcp -p codetopo-cli -p codetopo-server --target "${{ matrix.target }}"
            echo "BIN_DIR=target/${{ matrix.target }}/release" >> "$GITHUB_ENV"
          else
            cargo build --release -p codetopo-acp -p codetopo-mcp -p codetopo-cli -p codetopo-server
            echo "BIN_DIR=target/release" >> "$GITHUB_ENV"
          fi

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          for bin in codetopo-acp codetopo-mcp codetopo codetopo-server; do
            cp "$BIN_DIR/$bin" dist/
            tar -czf "$bin-${{ matrix.platform }}.tar.gz" -C dist "$bin"
            shasum -a 256 "$bin-${{ matrix.platform }}.tar.gz" > "$bin-${{ matrix.platform }}.tar.gz.sha256"
            rm "dist/$bin"
          done

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($bin in @("codetopo-acp", "codetopo-mcp", "codetopo", "codetopo-server")) {
            Copy-Item "$env:BIN_DIR/$bin.exe" dist/
            Compress-Archive -Path "dist/$bin.exe" -DestinationPath "$bin-${{ matrix.platform }}.zip"
            (Get-FileHash "$bin-${{ matrix.platform }}.zip" -Algorithm SHA256).Hash.ToLower() + "  $bin-${{ matrix.platform }}.zip" | Out-File -Encoding ascii "$bin-${{ matrix.platform }}.zip.sha256"
            Remove-Item "dist/$bin.exe"
          }

      # The certification evidence (this platform): this leg's packaged
      # archives, by hash. The certify job combines the five platform
      # fragments into the release evidence and verifies every
      # downloaded archive against them before closing the declaration.
      - name: Write the release evidence (this platform)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            sha256sum codetopo-*-${{ matrix.platform }}.zip > "release-evidence-${{ matrix.platform }}.txt"
          else
            sha256sum codetopo-*-${{ matrix.platform }}.tar.gz > "release-evidence-${{ matrix.platform }}.txt"
          fi
          cat "release-evidence-${{ matrix.platform }}.txt"

      - name: Upload run artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codetopo-binaries-${{ matrix.platform }}
          path: |
            codetopo-*-${{ matrix.platform }}.*
            release-evidence-${{ matrix.platform }}.txt

  certify:
    name: Certify the release
    needs: [declare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download the build artifacts (all platforms)
        uses: actions/download-artifact@v7
        with:
          pattern: codetopo-binaries-*
          merge-multiple: true

      # Combine the five platform evidence fragments into the release
      # evidence, proving first that every archive on disk hashes to
      # the value its build leg recorded.
      - name: Assemble + verify the release evidence
        shell: bash
        run: |
          set -eu
          cat release-evidence-*.txt > evidence-hashes.txt
          sha256sum --check evidence-hashes.txt
          {
            echo "target: codetopo"
            echo "version: ${{ needs.declare.outputs.tag }}"
            echo "base: ${GITHUB_SHA}"
            cat evidence-hashes.txt
          } > release-evidence.txt
          cat release-evidence.txt

      - name: Certify the release against the build evidence
        uses: nrupala/platform-ci-scaffolding/declare-certify/certify@41666ef6f938c01e8422d7d7b595e6438724193d
        with:
          declaration-id: ${{ needs.declare.outputs.declaration-id }}
          evidence: release-evidence.txt
          note: "codetopo release binaries ${{ needs.declare.outputs.tag }}"

  publish:
    name: Publish to the GitHub release
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: [declare, certify]
    permissions:
      contents: write # this job uploads the packaged binaries to the release
      # Build-provenance attestation (SLSA L2 via Sigstore) for release artifacts
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      # The guard: downloads the CLOSED declaration record and fails
      # this job while it is OPEN — the attach below is unreachable
      # for an uncertified release.
      - name: Guard — the declaration must be CLOSED
        uses: nrupala/platform-ci-scaffolding/declare-certify/guard@35c8c282f6d508568196647d756f1d5929c7538e
        with:
          declaration-id: ${{ needs.declare.outputs.declaration-id }}

      - name: Download the build artifacts (all platforms)
        uses: actions/download-artifact@v7
        with:
          pattern: codetopo-binaries-*
          merge-multiple: true

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.declare.outputs.tag }}" codetopo-*.tar.gz codetopo-*.tar.gz.sha256 codetopo-*.zip codetopo-*.zip.sha256 --clobber

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            codetopo-*.tar.gz
            codetopo-*.zip
