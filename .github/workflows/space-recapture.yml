#
# space-recapture — keeps the Hugging Face Space's data bundle
# (space-static/data/) a capture of CURRENT main instead of a
# one-time snapshot. On every merge to main: build codetopo-server
# from the tree, index this repository with it, save the API
# responses byte-for-byte (scripts/capture-space-bundle.sh runs
# the honesty gates — counts and audit head — before anything is
# written), and commit the refreshed bundle. That commit is what
# hf-sync mirrors to the Space.
#
# Loop safety, two independent guards:
#   - paths-ignore: a commit touching ONLY space-static/data/**
#     (i.e. this workflow's own output) never re-triggers it;
#   - the job condition skips runs whose head commit is a
#     recapture commit, whatever else it touched.
#
# The commit is made by github-actions[bot] under its own identity
# — it is automation output, and it says so.
#
# PLATFORM RULE this design bends around: pushes made with the
# default GITHUB_TOKEN do NOT trigger further workflow runs
# (GitHub's recursion guard). The bot's data commit therefore
# cannot wake hf-sync by itself — so after committing, this
# workflow DISPATCHES hf-sync explicitly (workflow_dispatch is one
# of the events GITHUB_TOKEN is allowed to fire). Without that
# step the bundle lands on main and the Space still serves the
# previous mirror.

name: space-recapture

on:
  push:
    branches: [main]
    paths-ignore:
      - 'space-static/data/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: write # dispatch hf-sync after the data commit (see header)

concurrency:
  group: space-recapture
  cancel-in-progress: false

jobs:
  recapture:
    if: "${{ !startsWith(github.event.head_commit.message, 'data(space): recapture bundle') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the recorded source_commit is the newest
          # non-recapture commit, found by walking the log.
          fetch-depth: 0
          ref: main

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build codetopo-server from this tree
        run: cargo build --release --locked -p codetopo-server

      - name: Capture the bundle (honesty gates inside the script)
        run: |
          set -euo pipefail
          CODE_SHA="$(git log -1 --format=%H --invert-grep --grep='^data(space): recapture bundle')"
          echo "capturing code commit $CODE_SHA"
          bash scripts/capture-space-bundle.sh \
            target/release/codetopo-server "$GITHUB_WORKSPACE" "$CODE_SHA" space-static/data

      - name: Commit the refreshed bundle (if it changed)
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add space-static/data
          if git diff --cached --quiet; then
            echo "bundle already current — nothing to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE_SHA="$(git log -1 --format=%H --invert-grep --grep='^data(space): recapture bundle')"
          git commit -m "data(space): recapture bundle at $CODE_SHA"
          git push origin main
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # The bot's push cannot trigger hf-sync on its own (see the
      # header's platform rule) — dispatch the mirror explicitly.
      - name: Mirror the new bundle to the Space (dispatch hf-sync)
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hf-sync.yml --ref main
