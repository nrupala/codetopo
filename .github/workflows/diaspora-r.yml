# Diaspora R surface CI: build the extendr package in surfaces/r,
# install it, and run the known-answer conformance battery (F1–F5)
# through the R face. Paths-filtered: this workflow runs only when the
# R surface changes.
name: diaspora-r

on:
  push:
    paths:
      - "surfaces/r/**"
      - ".github/workflows/diaspora-r.yml"
  pull_request:
    paths:
      - "surfaces/r/**"
      - ".github/workflows/diaspora-r.yml"

permissions:
  contents: read

jobs:
  r-surface:
    runs-on: ubuntu-latest
    env:
      CODETOPO_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install R dependencies (jsonlite, testthat)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: surfaces/r
          extra-packages: any::jsonlite, any::testthat

      - name: R CMD INSTALL the package
        run: R CMD INSTALL surfaces/r

      - name: Run the testthat conformance suite
        run: |
          Rscript -e 'library(codetopo); res <- testthat::test_dir("surfaces/r/tests/testthat", reporter = "summary", stop_on_failure = TRUE)'
