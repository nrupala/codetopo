version = 1

# Test fixtures and generated snapshot data — part of the AGPL test suites;
# declared in bulk because generated/golden files should not be hand-edited.
[[annotations]]
path = [
    "crates/codetopo-core/tests/fixtures/**",
    "crates/codetopo-extract/tests/fixture-c/**",
    "crates/codetopo-extract/tests/fixture-cpp/**",
    "crates/codetopo-extract/tests/fixture-cs/**",
    "crates/codetopo-extract/tests/fixture-ex/**",
    "crates/codetopo-extract/tests/fixture-go/**",
    "crates/codetopo-extract/tests/fixture-hs/**",
    "crates/codetopo-extract/tests/fixture-java/**",
    "crates/codetopo-extract/tests/fixture-jl/**",
    "crates/codetopo-extract/tests/fixture-kt/**",
    "crates/codetopo-extract/tests/fixture-lua/**",
    "crates/codetopo-extract/tests/fixture-php/**",
    "crates/codetopo-extract/tests/fixture-py/**",
    "crates/codetopo-extract/tests/fixture-r/**",
    "crates/codetopo-extract/tests/fixture-rb/**",
    "crates/codetopo-extract/tests/fixture-scala/**",
    "crates/codetopo-extract/tests/fixture-sh/**",
    "crates/codetopo-extract/tests/fixture-swift/**",
    "space-static/data/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 2351485 ALBERTA INC."
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Project artwork (logo, demo graphic, icon).
[[annotations]]
path = "assets/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 2351485 ALBERTA INC."
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Generated lockfile — produced from the workspace Cargo.toml manifests.
[[annotations]]
path = "Cargo.lock"
precedence = "override"
SPDX-FileCopyrightText = "2026 2351485 ALBERTA INC."
SPDX-License-Identifier = "AGPL-3.0-or-later"
